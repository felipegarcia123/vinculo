name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
        working-directory: apps/api
      - name: Run API tests
        run: uv run pytest -q
        working-directory: apps/api

  web:
    name: Web tests, typecheck, and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:proxy
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_VINCULO_DEMO_ONLY: "true"
          DATABASE_URL: postgresql://ci:ci-only-db-canary-9c136aa2@127.0.0.1/vinculo_ci
          AUTH_RATE_LIMIT_SECRET: ci-only-rate-limit-canary-a71f02be
          NEON_API_KEY: ci-only-neon-api-canary-482ec773
          VINCULO_CI_DATABASE_CANARY: ci-only-db-canary-9c136aa2
          VINCULO_CI_AUTH_CANARY: ci-only-rate-limit-canary-a71f02be
          VINCULO_CI_NEON_CANARY: ci-only-neon-api-canary-482ec773
      - name: Check private values are absent from browser assets
        run: npm run check:client-bundle
        env:
          VINCULO_CI_DATABASE_CANARY: ci-only-db-canary-9c136aa2
          VINCULO_CI_AUTH_CANARY: ci-only-rate-limit-canary-a71f02be
          VINCULO_CI_NEON_CANARY: ci-only-neon-api-canary-482ec773
