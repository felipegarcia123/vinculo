[project]
name = "vinculo-api"
version = "0.1.0"
description = "Standalone customer loyalty service for Vínculo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
